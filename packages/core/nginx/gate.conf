# @@NGX_GATE@@/gate.conf -- password-protected folders.
# Installed by ~/pamela-setup/panel/deploy/install-panel.sh; included in BOTH
# @@DOMAIN@@ server blocks (the main site and folder subdomains).
#
# Every request is checked by pammy-gate (@@GATE_ADDR@@) before anything is
# served. The includer must:
#   - set $pammy_base first: / for @@DOMAIN@@, /$sub for <sub>.@@DOMAIN@@
#     (never empty: nginx drops empty headers, and the gate refuses a missing one)
#   - put "include @@NGX_GATE@@/uri.conf;" in every location that
#     serves files, and "auth_request off;" in every location that doesn't
#     (her /api/ proxy, ACME, WordPress). A location with neither gets a 403
#     from the gate, never content: it fails closed.
# If the gate is down, requests get nginx's 500 page, never a protected file.

auth_request /_pammy/check;
auth_request_set $pammy_login $upstream_http_x_pammy_login;
auth_request_set $pammy_cache $upstream_http_x_pammy_cache;
# who is signed in, for a PHP page in a protected folder (php.conf, P4): from
# the gate's answer, never from the request; empty everywhere else
auth_request_set $pammy_user $upstream_http_x_pammy_user;
# ... their account's number, and their role and privileges in that folder
# (docs/roles-plan.md step 3)
auth_request_set $pammy_account    $upstream_http_x_pammy_account;
auth_request_set $pammy_role       $upstream_http_x_pammy_role;
auth_request_set $pammy_privileges $upstream_http_x_pammy_privileges;
# "private, no-store" on anything inside a protected folder (and its sign-in
# page), so neither Cloudflare nor a shared browser cache ever keeps a copy.
# Empty for everything else, and nginx sends no header at all then.
add_header Cache-Control $pammy_cache always;
# Not signed in, or no access: to the folder's sign-in page.
error_page 401 = @pammy_login;

# Access-phase handlers don't run for subrequests, so this doesn't check itself.
location = /_pammy/check {
    internal;
    proxy_pass http://@@GATE_ADDR@@/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host         $host;
    proxy_set_header X-Pammy-Uri  $pammy_uri;      # decoded, normalised: exactly what would be served
    proxy_set_header X-Pammy-Base $pammy_base;
    proxy_set_header X-Pammy-Next $request_uri;
    proxy_set_header Cookie       $http_cookie;
    proxy_set_header X-Real-IP    "";              # never the visitor's own (S1c): the check doesn't need one
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    # up to 100 privileges of 64 characters in the answer's headers: never cut
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;      # nginx wants the others at least as large
}

# The sign-in component, built-in sign-in page, and sign-in/out requests.
location ^~ /_pammy/ {
    auth_request off;
#@if cloudflare
    include @@NGX_PANEL@@/cloudflare-realip.conf;   # real visitor IPs, for sign-in limits
#@end
    proxy_pass http://@@GATE_ADDR@@;
    proxy_http_version 1.1;
    proxy_set_header Host            $host;
    proxy_set_header X-Pammy-Base    $pammy_base;
    proxy_set_header X-Real-IP       $remote_addr;
    include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
    proxy_set_header X-Forwarded-For "";
    client_max_body_size 64k;   # contact form messages

    # A program adding or changing one of her records (the data API): a
    # rich-text field can be up to 100,000 characters, far past 64k
    # (docs/rich-text-plan.md). Nested, because the ^~ above means no regex
    # location outside it is ever looked at for /_pammy/. The gate itself
    # refuses one without a key before reading its body.
    location ~ ^/_pammy/api/data/[^/]+/[^/]+/[^/]+/(new|[^/]+/save)$ {
        client_max_body_size 2m;
        proxy_pass http://@@GATE_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Pammy-Base    $pammy_base;
        proxy_set_header X-Real-IP       $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For "";
    }
}

# Media folders' "photos" became "images" (docs/media-plan.md, 2026-09-18): old
# addresses go on to the new ones for good. A media folder is only ever at the
# top (/media) or one folder down (/olivia/media), and on a folder subdomain the
# address has no folder in front. It only rewrites the address it was given --
# it never looks at the file -- so it tells a stranger nothing about a protected
# folder; the new address then passes the gate as usual. rewrite (not return)
# so a name with spaces or accents comes out correctly escaped.
location ~ ^/(?:[^/]+/)?media/photos(?:/|$) {
    auth_request off;
    rewrite ^(/(?:[^/]+/)?)media/photos(.*)$ $1media/images$2 permanent;
}

location @pammy_login {
    add_header Cache-Control "private, no-store" always;
    return 302 $pammy_login;
}

# PHP pages (docs/tutorials-plan.md P1): run by pammy-php, after the gate, and
# never served as text. Last here, but still ahead of the vhost's own regexes.
#@if php
include @@NGX_GATE@@/php.conf;
#@end
