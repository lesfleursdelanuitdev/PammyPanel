# @@PANEL_HOST@@ -- the @@SITE_NAME@@ control panel (@@PANEL_NAME@@.service, @@PANEL_ADDR@@).
# Installed by ~/pamela-setup/panel/@@INSTALLER@@ as
# /etc/nginx/sites-available/@@PANEL_NAME@@. Edit the master, re-run the installer.
#
#@if folder-subdomains
# An exact server_name, so it beats the folder-subdomain regex in the pamela
# vhost: a folder called "panel" in her website never shows at this address.
#@else
# An exact server_name, so it beats the catch-all for the site's hosts: no host
# can show anything at this address.
#@end

#@if cloudflare
# ONLY Cloudflare may connect. The origin IP is public; without this anyone could
# skip Cloudflare (and any rules she adds there) by sending Host: @@PANEL_HOST@@
# straight to the server. $realip_remote_addr is the real TCP peer, before
# CF-Connecting-IP replaces $remote_addr.
geo $realip_remote_addr $pammy_panel_via_cloudflare {
    default 0;
    include @@NGX_PANEL@@/cloudflare-ips.geo;
}
#@end
#@if vpn
# ONLY the VPN may connect (@@VPN_SUBNET@@): everyone else gets the connection
# closed without a response.
geo $remote_addr $pammy_panel_via_vpn {
    default 0;
    @@VPN_SUBNET@@ 1;
}
#@end

server {
    listen 80;
    listen [::]:80;
    server_name @@PANEL_HOST@@;

#@if cloudflare
    include @@NGX_PANEL@@/cloudflare-realip.conf;
    if ($pammy_panel_via_cloudflare = 0) {
        return 444;
    }
#@end
#@if vpn
    if ($pammy_panel_via_vpn = 0) {
        return 444;
    }
#@end
    return 301 https://@@PANEL_HOST@@$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@PANEL_HOST@@;

    ssl_certificate     @@PANEL_CERT@@;
    ssl_certificate_key @@PANEL_KEY@@;
#@if tls-more
@@PANEL_TLS_MORE@@
#@end

    access_log /var/log/nginx/@@PANEL_NAME@@.access.log;
    error_log  /var/log/nginx/@@PANEL_NAME@@.error.log;

#@if cloudflare
    include @@NGX_PANEL@@/cloudflare-realip.conf;
    if ($pammy_panel_via_cloudflare = 0) {
        return 444;    # close without a response
    }
    # In Full (strict) mode Cloudflare reaches us over https even when the
    # visitor typed http://, and tells us so in X-Forwarded-Proto (trusted: the
    # line above already proved this request came from Cloudflare).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://@@PANEL_HOST@@$request_uri;
    }
#@end
#@if vpn
    if ($pammy_panel_via_vpn = 0) {
        return 444;    # close without a response
    }
#@end

    client_max_body_size 64k;

    # Uploads (the Media tab and File Explorer): one file per request, up to @@UPLOAD_MB@@ MB
#@if cloudflare
    # -- the most Cloudflare's free plan lets through. Passed straight on to the
    # panel as it arrives, not stored on disk here first.
#@else
    # (the site's profile). Passed straight on to the panel as it arrives, not
    # stored on disk here first.
#@end
    location ~ ^/api/(media|files)/upload$ {
        client_max_body_size @@UPLOAD_MB@@m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
    }

    # The editor: a whole text file (at most 2 MB, sent as JSON, which can grow it)
    # when saving, and the unsaved text for its preview.
    location ~ ^/api/files/(save|draft)$ {
        client_max_body_size 8m;
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # A record from one of her database apps (new or save): a rich-text field
    # can hold up to 100,000 characters of HTML (docs/rich-text-plan.md T16),
    # which the 64k below would refuse long before the panel saw it.
    location ~ ^/api/app/[^/]+/[^/]+/[^/]+/(new|save)$ {
        client_max_body_size 2m;
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
    }

    # Files for previews and players (Media and File Explorer): streamed, not
    # buffered to disk.
    location ~ ^/api/(media|files)/file$ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
    }

    # Installed software (docs/apps-plan.md phase 2): a new WordPress admin
    # password runs wp-cli in a container, twice, which can take longer than
    # the 30 seconds below; a backup downloads as one .tar streamed from the
    # software helper. Small bodies, like every other request.
    # A regex, not "location ^~ /api/software/": a prefix ending in a slash
    # makes nginx answer /api/software (the list) with its own 301 to
    # /api/software/, which isn't a page (2026-09-23).
    location ~ ^/api/software(/|$) {
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
    }

#@if projects
    # nginx's check for git over HTTPS (docs/phase8b-plan.md 8b-7): asked by the git site only
    location = /api/projects/git-auth {
        return 404;
    }

#@end
#@if examples
    # The tutorial examples' PHP pages (docs/tutorial-examples-plan.md)
    include @@NGX_PANEL@@/tutorial-examples.conf;
#@end

    location / {
        proxy_pass http://@@PANEL_ADDR@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
#@if cloudflare
        # after real_ip this IS the visitor (from CF-Connecting-IP, trusted only
        # from Cloudflare's ranges); the app believes it only from localhost
#@else
        # the visitor itself (nothing stands in front); the app believes it only
        # from localhost
#@end
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
