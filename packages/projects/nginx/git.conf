# @@GIT_HOST@@ -- git over HTTPS for the @@SITE_NAME@@ projects (docs/phase8b-plan.md 8b-7).
# Installed by ~/pamela-setup/panel/@@INSTALLER@@ as /etc/nginx/sites-available/lfdln-git.
# Edit the master, re-run the installer.
#
#   https://@@GIT_HOST@@/<project>.git, with a person's git token (Projects > Your git tokens)
#
# Every request asks the panel first (auth_request, D7-4): who the token is, and whether they
# may read the project or push to it. Only then does git-http-backend run, under fcgiwrap as
# svc-lfdln-apps (lfdln-git-http.socket, D7-5), with REMOTE_USER = the name the panel answered.
# An exact server_name, so no host of the site can show anything at this address.

limit_req_zone $binary_remote_addr zone=lfdln_git:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @@GIT_HOST@@;
    return 301 https://@@GIT_HOST@@$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@GIT_HOST@@;

    # the site's wildcard certificate, as the panel's
    ssl_certificate     @@PANEL_CERT@@;
    ssl_certificate_key @@PANEL_KEY@@;
#@if tls-more
@@PANEL_TLS_MORE@@
#@end

    access_log /var/log/nginx/lfdln-git.access.log;
    error_log  /var/log/nginx/lfdln-git.error.log;

    limit_req zone=lfdln_git burst=40 nodelay;

    # the panel's check: never the request's body; the token travels in Authorization
    location = /_auth {
        internal;
        proxy_pass http://@@PANEL_ADDR@@/api/projects/git-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              @@PANEL_HOST@@;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    # git's smart HTTP only (named captures: the check's subrequest can't overwrite them)
    # (quoted: a regex with { } must be, or nginx reads the brace as the block's)
    location ~ "^/(?<git_project>[a-z0-9-]{1,36})\.git(?<git_path>/(?:info/refs|git-upload-pack|git-receive-pack))$" {
        auth_request /_auth;
        auth_request_set $git_user $upstream_http_x_lfdln_git_user;
        error_page 401 = @token;

        # a push up to 200 MB (D7-8), passed on as it arrives, both ways
        client_max_body_size 200m;
        fastcgi_request_buffering off;
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;

        # Not fastcgi_params: it sets REMOTE_USER from the name the client typed. And none of the
        # request's headers (Authorization is the token): only the two git needs.
        fastcgi_pass_request_headers off;
        fastcgi_param SCRIPT_FILENAME      /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT     /srv/lfdln-projects;
        fastcgi_param GIT_HTTP_EXPORT_ALL  1;
        fastcgi_param PATH_INFO            /$git_project/repo.git$git_path;
        fastcgi_param REMOTE_USER          $git_user;
        fastcgi_param REMOTE_ADDR          $remote_addr;
        fastcgi_param QUERY_STRING         $query_string;
        fastcgi_param REQUEST_METHOD       $request_method;
        fastcgi_param CONTENT_TYPE         $content_type;
        fastcgi_param CONTENT_LENGTH       $content_length;
        fastcgi_param SERVER_PROTOCOL      $server_protocol;
        fastcgi_param GATEWAY_INTERFACE    CGI/1.1;
        fastcgi_param HTTP_CONTENT_ENCODING $http_content_encoding;
        fastcgi_param HTTP_GIT_PROTOCOL    $http_git_protocol;
        fastcgi_pass unix:/run/lfdln-git-http.sock;
    }

    # no token, or a wrong one: git asks for one (user name = your panel username)
    location @token {
        add_header WWW-Authenticate 'Basic realm="@@GIT_HOST@@ (your panel username and a git token)", charset="UTF-8"' always;
        return 401;
    }

    location / {
        return 404;
    }
}
