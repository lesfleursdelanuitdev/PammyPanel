# @@NGX_PANEL@@/tutorial-examples.conf -- the tutorial examples' PHP
# pages on @@PANEL_HOST@@ (docs/tutorial-examples-plan.md). Installed by
# ~/pamela-setup/panel/deploy/install-panel.sh; included in the panel's https
# server block, above "location /".
#
# Only the PHP pages are here. Everything else under /tutorial-examples/ (their
# HTML, CSS and JavaScript) is served by the panel itself, which also answers
# their questions to /_pammy/ on this address.
#
# Each PHP page first asks the panel who is signed in: an account manager, or
# nobody (401, and PHP never runs). That username is PAMMY_USER on the page, the
# way the gate's is on her website. PHP is pammy-php's second pool, which can
# read the examples' folder and nothing of her website.

location = /_pammy-tutorial-examples-who {
    internal;
    proxy_pass http://@@PANEL_ADDR@@/api/tutorial-examples/who;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $host;
    proxy_set_header Cookie          $http_cookie;
    proxy_set_header X-Real-IP       $remote_addr;
    include @@EDGE@@;   # X-Lfdln-Edge: so the app believes X-Real-IP (S1c)
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

# /tutorial-examples/journal-php/ (index.php) and its pages, and the same for todo-php
location ~ "^/tutorial-examples/(?<pammy_example>journal-php|todo-php)/(?<pammy_example_page>(?:[a-z]+\.php)?)$" {
    auth_request /_pammy-tutorial-examples-who;
    auth_request_set $pammy_panel_user $upstream_http_x_panel_user;
    set $pammy_example_script $pammy_example_page;
    if ($pammy_example_script = "") {
        set $pammy_example_script index.php;
    }
    fastcgi_pass unix:@@PHP_RUN@@/examples.sock;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME @@TUTORIAL_EXAMPLES@@/$pammy_example/$pammy_example_script;
    fastcgi_param PAMMY_USER      $pammy_panel_user;
    # the panel's sign-in is none of PHP's business
    fastcgi_param HTTP_COOKIE     "";
    fastcgi_param HTTP_PROXY      "";
    fastcgi_read_timeout 35s;
    client_max_body_size 64k;
    # (scripts and requests from the panel itself: the journal's comments,
    # /_pammy/comments.js, which also styles itself inline)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'none'" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Any other PHP-looking name under the examples: not there, and never as text.
location ~* "^/tutorial-examples/.*\.(?:php[0-9]?|phtml|phar|phps)$" {
    return 404;
}
