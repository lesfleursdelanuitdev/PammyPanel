<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@TITLE@</title>
  <link rel="stylesheet" href="@FILES@/style.css">
  <script src="@FILES@/gallery.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>@TITLE@</h1>
    <p class="intro">Click a picture to see it big.</p>

    <!-- gallery.js fills this in from the address in data-api: the pictures in a
         media folder that have every tag and category in it (see 12-media-on-your-pages.txt).
         data-empty is what to say when there are none. -->
    <ul class="gallery" data-api="@API@" data-empty="No pictures here yet."></ul>
    <p class="more" hidden><button type="button" class="more-button">Show more</button></p>

    <!-- one picture, big, with the arrows -->
    <dialog class="lightbox" aria-label="Picture">
      <figure>
        <img alt="">
        <figcaption></figcaption>
      </figure>
      <button type="button" class="prev" aria-label="Previous picture">&#8249;</button>
      <button type="button" class="next" aria-label="Next picture">&#8250;</button>
      <button type="button" class="close" aria-label="Close">&times;</button>
    </dialog>
  </main>
</body>
</html>
