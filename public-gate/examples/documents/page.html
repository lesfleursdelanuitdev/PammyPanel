<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@TITLE@</title>
  <link rel="stylesheet" href="@FILES@/style.css">
  <script src="@FILES@/documents.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>@TITLE@</h1>
    <p class="intro">Click one to open it, or download it to keep.</p>

    <!-- documents.js fills this in from the address in data-api: the files in a
         media folder that have every tag and category in it (see 12-media-on-your-pages.txt). -->
    <ul class="documents" data-api="@API@" data-empty="Nothing here yet."></ul>
  </main>
</body>
</html>
