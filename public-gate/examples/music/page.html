<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@TITLE@</title>
  <link rel="stylesheet" href="@FILES@/style.css">
  <script src="@FILES@/music.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>@TITLE@</h1>

    <!-- music.js fills this in from the address in data-api: the songs in a media
         folder that have every tag and category in it (see 12-media-on-your-pages.txt). -->
    <section class="player" aria-label="Music player" data-api="@API@" data-empty="No songs here yet.">
      <div class="now">
        <img class="cover" alt="">
        <div class="about">
          <p class="playing" aria-live="polite">&nbsp;</p>
          <div class="buttons">
            <button type="button" class="prev" aria-label="Previous song">&#9198;</button>
            <button type="button" class="play" aria-label="Play">&#9654;</button>
            <button type="button" class="next" aria-label="Next song">&#9197;</button>
          </div>
          <div class="progress">
            <span class="time">0:00</span>
            <input type="range" class="seek" min="0" max="0" step="1" value="0" aria-label="Where in the song">
            <span class="length">0:00</span>
          </div>
        </div>
      </div>
      <ol class="songs"></ol>
      <audio preload="metadata"></audio>
    </section>
  </main>
</body>
</html>
