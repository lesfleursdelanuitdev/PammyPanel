# pammy-pg: who may connect (docs/postgres-plan.md P3, P5). Read by Postgres from
# /etc/pammy-pg/pg_hba.conf inside the container; installed by install-pg.sh.
# First match wins.

# the superuser: only from inside the container (podman exec -u postgres psql)
local   all     postgres                                peer
# the panel, the gate and the installer: only to pammy, only with a password
host    pammy   pammy_owner,pammy_panel,pammy_gate  all scram-sha-256
# everything else, including the superuser over the network
local   all     all                                     reject
host    all     all                                 all reject
