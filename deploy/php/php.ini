; /etc/pammy-php/php.ini -- used instead of the distribution's fpm php.ini
; (docs/tutorials-plan.md P1-P7). The extensions still come from
; /etc/php/8.3/fpm/conf.d (curl, opcache, and PHP's own).
; Installed by ~/pamela-setup/panel/deploy/install-panel.sh

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off
max_execution_time = 20
max_input_time = 30
memory_limit = 128M
error_reporting = E_ALL
; a stranger never sees her mistakes (or the paths in them); she reads them in
; the journal: journalctl -u pammy-php
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 8M
default_mimetype = "text/html"
default_charset = "UTF-8"
enable_dl = Off
file_uploads = On
upload_max_filesize = 8M
max_file_uploads = 10
allow_url_fopen = Off
allow_url_include = Off
default_socket_timeout = 10

; no other programs, and no sockets but the one curl is given (P3): PHP has no
; network at all, and the gate's socket is the only one it can open
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,putenv,mail,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,stream_socket_pair,posix_kill,posix_setuid,posix_setgid,posix_mkfifo

[Date]
date.timezone = UTC

[Pcre]
; the JIT needs writable+runnable memory, which the service forbids (MemoryDenyWriteExecute)
pcre.jit = 0

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.name = PAMMYPHPSESSID
session.gc_maxlifetime = 86400
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable = 1
opcache.jit = off
opcache.jit_buffer_size = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
