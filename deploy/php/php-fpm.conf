; /etc/pammy-php/php-fpm.conf -- the PHP pages on her website (docs/tutorials-plan.md P1-P7).
; Run by pammy-php.service as svc-pammyphp (never root, so there is no user
; switching here). Installed by ~/pamela-setup/panel/deploy/install-panel.sh

[global]
pid = /run/pammy-php/php-fpm.pid
error_log = syslog
syslog.ident = pammy-php
log_level = notice
daemonize = no

[her-website]
listen = /run/pammy-php/fpm.sock
; nginx (www-data) may knock; nobody else
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s

; what her pages print to their error log reaches the journal (journalctl -u pammy-php)
catch_workers_output = yes
decorate_workers_output = no

; nothing from the service's own environment, only what is set here (P7)
clear_env = yes
env[PAMMY_API_SOCKET] = /run/pammy-gate-php.sock
env[TMPDIR] = /tmp

; only files called .php are run
security.limit_extensions = .php

; her pages cannot loosen these with ini_set()
php_admin_value[open_basedir] = /pamela/public/:/tmp/
php_admin_value[session.save_path] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_execution_time] = 20
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off

; The tutorial examples (docs/tutorial-examples-plan.md): the finished copies of
; guides 16 and 18, on panel.pammy.org. The same limits as her website's pool,
; but it reads only the examples' folder, never her website. nginx sends it
; only pages whose visitor is signed in to the panel.
[tutorial-examples]
listen = /run/pammy-php/examples.sock
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s

catch_workers_output = yes
decorate_workers_output = no

clear_env = yes
env[PAMMY_API_SOCKET] = /run/pammy-gate-php.sock
env[TMPDIR] = /tmp

security.limit_extensions = .php

php_admin_value[open_basedir] = /var/lib/pammy-tutorial-examples/:/tmp/
php_admin_value[session.save_path] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_execution_time] = 20
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
