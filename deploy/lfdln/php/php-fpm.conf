; /etc/lfdln-php/php-fpm.conf -- PHP pages in lfdln's site folders (platform plan F5),
; the same limits as pammy.org's (deploy/php/php-fpm.conf). Run by lfdln-php.service as
; svc-lfdlnphp (never root). Installed by ~/pamela-setup/panel/deploy/lfdln/install-lfdln.sh

[global]
pid = /run/lfdln-php/php-fpm.pid
error_log = syslog
syslog.ident = lfdln-php
log_level = notice
daemonize = no

[site-folders]
listen = /run/lfdln-php/fpm.sock
; nginx (www-data, in lfdln-sites) may knock; nobody else
listen.group = lfdln-sites
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s

catch_workers_output = yes
decorate_workers_output = no

; nothing from the service's own environment
clear_env = yes
env[TMPDIR] = /tmp
; the gate's data API, for pages holding a key (docs/phase8-plan.md 8-4; the name is pammy.org's, P8-13)
env[PAMMY_API_SOCKET] = /run/lfdln-gate-php.sock

security.limit_extensions = .php

; the pages cannot loosen these with ini_set()
php_admin_value[open_basedir] = /var/www/lesfleursdelanuit-sub/:/tmp/
php_admin_value[session.save_path] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_execution_time] = 20
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
