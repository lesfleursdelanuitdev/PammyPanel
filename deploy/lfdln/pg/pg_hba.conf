# lfdln-pg: who may connect (as pammy.org's deploy/pg/pg_hba.conf). Read by Postgres
# from /etc/lfdln-pg/pg_hba.conf inside the container; installed by install-pg.sh.
# First match wins.

# the superuser: only from inside the container (podman exec -u postgres psql)
local   all     postgres                                peer
# the panel, its gate (accounts step 3) and the installer: only to lfdln, only with a password
host    lfdln   pammy_owner,pammy_panel,pammy_gate  all scram-sha-256
# everything else, including the superuser over the network
local   all     all                                     reject
host    all     all                                 all reject
