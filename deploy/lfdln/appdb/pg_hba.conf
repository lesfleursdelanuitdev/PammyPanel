# lfdln-appdb (docs/data-move-plan.md M4): each app's roles to their own database, with a
# password, and nothing else. The apps connect through slirp4netns, so the address is
# never theirs: the database and the role are what tell them apart.
local   all                 postgres                            peer
host    tutorstar           tutorstar                       all scram-sha-256
host    ligneous_frontend   gonsalves_readonly              all scram-sha-256
# ligneous_user may make databases (CREATEDB, as on :5432): Prisma's migrate dev makes a
# shadow database of its own for a while, and connects to it
host    all                 ligneous_user                   all scram-sha-256
# the projects' own databases (apps.sql): owner and app role, each to its own
host    examprep            examprep_owner,examprep_app     all scram-sha-256
# the Studio (docs/phase8-plan.md 8-4, studio.sql): its own databases, whatever they are called,
# and the apps' read-only (grants, and the helper, say what it may do in each)
host    all                 pammy_studio                    all scram-sha-256
# the logins the Studio makes (P8-15): named db_..., to the databases it made and granted them,
# never to the apps' databases or the engine's own (rejected first: the first line that matches wins)
host    tutorstar,ligneous_frontend,examprep,postgres,template1  /^db_  all  reject
host    all                 /^db_[a-z0-9_]+$                all scram-sha-256
local   all                 all                                 reject
host    all                 all                             all reject
