# What lfdln-offsite copies off the server (docs/recovery-plan.md, R1). One path per line;
# globs allowed. A path that isn't there is skipped and named in status.json ("missing").
# The installer puts this file in /etc/lfdln-offsite/ on every install: change it here.

# --- the databases, as their nightly dumps (never the engines' own files)
/var/lib/svc-pammypanel-db/backups          # pammy.org's panel (PG :5434)
/var/lib/svc-lfdlnpanel-db/backups          # lfdln's panel (PG :5435)
/var/lib/svc-lfdlnappdb/backups             # the apps' Postgres: TutorStar, Gonsalves, exam prep (:5436)
/var/lib/svc-lfdlnmaria/backups             # the apps' MariaDB (:3308)
/srv/pamela-db/backups                      # Pamela's MariaDB and Postgres (:3307, :5433)
/var/lib/svc-pammywp/backups                # WordPress (blog.pammy.org and the others): database + files
/var/lib/lfdln-offsite/dumps                # the server's own Postgres (:5432), dumped by lfdln-offsite

# --- settings and keys (encrypted before they leave, like everything else)
/etc/lfdln-panel
/etc/pammy-panel
/etc/nginx
/etc/letsencrypt
/etc/systemd/system
/var/lib/svc-*/.config                      # Quadlets, user units, podman settings
/var/lib/svc-*/.local/share/containers/storage/secrets    # podman secrets (database passwords)

# --- the helpers' state
/var/lib/pammy-apps
/var/lib/pammy-tutorial-examples
/var/lib/lfdln-projects
/var/lib/lfdln-services
/var/lib/lfdln-watchdog
/var/lib/svc-pammypanel
/var/lib/svc-lfdlnpanel
/var/lib/svc-pammygate
/var/lib/svc-lfdlngate
/var/lib/svc-lfdln-apps

# --- people's files
/pamela/public                              # Pamela's website
/pamela/apps                                # her installed software's files
/pamela/wordpress
/pamela/trash
/srv/pamela-wordpress
/home/pamela
/var/www                                    # lfdln site folders (lesfleursdelanuit-sub) and the old static ones
/srv/lfdln-projects                         # Code projects: their git repositories and files
/mnt/storage/uploads                        # Gonsalves' uploads
