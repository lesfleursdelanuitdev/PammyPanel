# /etc/nginx/pammy-gate/uri.conf -- include in every location that serves files.
# Hands the gate the exact path about to be served. It has to be set here, in
# the location: a server-level "set" runs again inside the auth subrequest and
# would be overwritten with /_pammy/check (tested 2026-09-16).
set $pammy_uri $uri;
