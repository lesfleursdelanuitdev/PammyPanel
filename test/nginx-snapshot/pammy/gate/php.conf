# /etc/nginx/pammy-gate/php.conf -- PHP pages on her website (docs/tutorials-plan.md P1, P4, P5).
# Installed by ~/pamela-setup/panel/deploy/install-panel.sh; included by
# gate.conf, so it is in BOTH pammy.org server blocks.
#
# gate.conf comes before the vhost's own locations, so these regexes are looked
# at first of all. Hence:
#   - a path with a dot-folder or dot-file in it is left alone here, and meets
#     the vhost's dotfile deny as before;
#   - it sets no error_page or auth_request_set of its own: the server's 404 page (or WordPress's,
#     when WordPress is the main site) and the gate's sign-in redirect apply.
# The gate has checked the request before try_files looks for the file, so a
# protected folder says nothing about what is in it.

# A folder's home page is index.html or, when it has none, index.php. (index
# adds to the vhost's own "index index.html"; the gate knows the same two.)
index index.php;

location ~ "^(?!.*/\.).*\.php$" {
    include /etc/nginx/pammy-gate/uri.conf;
    # $pammy_user is set in gate.conf, with the others: an auth_request_set
    # here would hide theirs (no private header, an empty sign-in redirect)
    try_files $uri =404;
    fastcgi_pass unix:/run/pammy-php/fpm.sock;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param PAMMY_USER       $pammy_user;
    fastcgi_param PAMMY_ACCOUNT    $pammy_account;
    fastcgi_param PAMMY_ROLE       $pammy_role;
    fastcgi_param PAMMY_PRIVILEGES $pammy_privileges;
    # the same names sent by a visitor as headers never reach PHP, even as HTTP_*
    fastcgi_param HTTP_X_PAMMY_USER       "";
    fastcgi_param HTTP_X_PAMMY_ACCOUNT    "";
    fastcgi_param HTTP_X_PAMMY_ROLE       "";
    fastcgi_param HTTP_X_PAMMY_PRIVILEGES "";
    fastcgi_param HTTP_PROXY      "";
    fastcgi_read_timeout 35s;
    client_max_body_size 8m;
    # PHP down means nginx's 502 page -- never the file as text (P5)
}

# Anything else PHP might once have run (x.PHP, x.phtml, x.php7, x.phar, x.phps)
# is never handed out as text: to a visitor it isn't there.
location ~* "\.(?:php[0-9]?|phtml|phar|phps)$" {
    auth_request off;
    return 404;
}
