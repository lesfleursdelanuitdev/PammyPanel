server {
    server_name lesfleursdelanuit.com www.lesfleursdelanuit.com;

    root /var/www/lesfleursdelanuit;
    index index.html;

    # static only — no PHP, no proxy
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lesfleursdelanuit.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lesfleursdelanuit.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.lesfleursdelanuit.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lesfleursdelanuit.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lesfleursdelanuit.com www.lesfleursdelanuit.com;
    return 404; # managed by Certbot




}