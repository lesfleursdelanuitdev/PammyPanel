# Instastylr — static site served directly by nginx (no app server).
# This is the HTTP (:80) block; certbot --nginx adds the :443 block + redirect,
# mirroring the existing lesfleursdelanuit.com config. The security headers below
# are written so they end up on the HTTPS responses after certbot rewrites this
# block to listen on 443.
server {
    server_name instastylr.lesfleursdelanuit.com;

    root /var/www/instastylr;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # NOTE: nginx's add_header does NOT merge across inheritance levels — a
    # location that declares ANY add_header drops every header inherited from the
    # server block. The /assets/ location therefore repeats the headers it needs.
    #
    # CSP is strict (no 'unsafe-inline'): the build emits only external hashed
    # JS/CSS — no inline <script>/<style> — and both React (style props) and
    # Lexical (node styles via element.style.cssText) apply inline styles through
    # the CSSOM, which CSP does not govern. The app makes no network calls and
    # loads no third-party origins, so everything is 'self'.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Honored only over HTTPS (ignored on the plain :80 hop); lands on the 443
    # block certbot produces from this server.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed build assets are immutable — cache them hard. Repeats the security
    # headers because this location's add_header suppresses the inherited set.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Single-page entry; fall back to index.html for any other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/instastylr.lesfleursdelanuit.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/instastylr.lesfleursdelanuit.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = instastylr.lesfleursdelanuit.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name instastylr.lesfleursdelanuit.com;
    return 404; # managed by Certbot


}