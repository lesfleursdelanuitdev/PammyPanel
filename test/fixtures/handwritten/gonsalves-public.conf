server {
    server_name gonsalvesfamily.com www.gonsalvesfamily.com;
    client_max_body_size 25m;

    # --- Public media served straight from disk (added to fix broken images) ---
    # The public site references GEDCOM/site media as site-relative /uploads/... paths.
    # Serve only the PUBLIC subtrees from /mnt/storage; user-media is intentionally
    # NOT exposed here (it is private and auth-checked by the admin app).
    location /uploads/gedcom-admin/ {
        alias /mnt/storage/uploads/gedcom-admin/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /uploads/site-media/ {
        alias /mnt/storage/uploads/site-media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # --------------------------------------------------------------------------

    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3039;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3039;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gonsalvesfamily.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gonsalvesfamily.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.gonsalvesfamily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gonsalvesfamily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gonsalvesfamily.com www.gonsalvesfamily.com;
    return 404; # managed by Certbot




}
